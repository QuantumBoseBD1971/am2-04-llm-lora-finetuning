name: Run real LLM adaptation experiment

on:
  workflow_dispatch:
    inputs:
      run_lora:
        description: Train and evaluate the heavier LoRA adapter
        required: true
        default: false
        type: boolean
      commit_evidence:
        description: Commit the generated evidence pack back to the selected branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project with real prompting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm,retrieval]"

      - name: Run tests
        run: pytest -q

      - name: Run deterministic prompting baseline
        run: python scripts/run_prompting_baseline.py

      - name: Run deterministic retrieval-assisted prompting
        run: python scripts/run_retrieval_prompting.py

      - name: Run real Hugging Face prompting and semantic retrieval
        run: python scripts/run_real_prompting.py

      - name: Install LoRA fine-tuning dependencies
        if: ${{ inputs.run_lora }}
        run: pip install -e ".[finetune]"

      - name: Train LoRA adapter
        if: ${{ inputs.run_lora }}
        run: python scripts/train_lora.py

      - name: Evaluate base model vs LoRA adapter
        if: ${{ inputs.run_lora }}
        run: python scripts/evaluate_lora.py

      - name: Finalise project results
        run: python scripts/finalise_project.py

      - name: Build assessor evidence pack
        run: python scripts/build_evidence_pack.py

      - name: Upload complete experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: am2-04-real-llm-adaptation-results
          path: |
            results/
            evidence/
            artifacts/lora_phase3/training_metrics.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit compact evidence pack
        if: ${{ inputs.commit_evidence }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evidence/
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "Add real LLM adaptation experiment evidence"
          git push origin HEAD:${{ github.ref_name }}
